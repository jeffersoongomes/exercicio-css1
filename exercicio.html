<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício CSS</title>
  <style>
    /* RESET: Tira margens padrão do navegador */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* BODY: Centraliza o card na tela inteira */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #e1e1e6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CARD: O container principal */
    /* CARD: Agora com 15cm x 15cm */
    .card {
      position: relative;
      width: 12cm;
      height: 12cm;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #29292e;
      background-color: #202024;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* Distribui o conteúdo no centro da caixa de 15cm */
      gap: 16px;
    }

    /* SELO ONLINE: Fixado no canto do card */
    .status-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: #04d361;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* FOTO */
    .foto-perfil {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 3px solid #8257e5;
      object-fit: cover;
    }

    /* TEXTOS */
    .info {
      text-align: center;
    }

    .info h2 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 4px;
    }

    .info p {
      font-size: 14px;
      color: #a8a8b3;
    }

    /* TAGS DE HABILIDADES */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .tag {
      background-color: #29292e;
      color: #00b37e;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
    }

    /* BOTÃO GITHUB */
    .btn-github {
      width: 100%;
      padding: 12px;
      background-color: #8257e5;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="status-badge">ONLINE</span>

    <img class="foto-perfil" src="https://github.com/jeffersoongomes.png" alt="Foto de Perfil">

    <div class="info">
      <h2>Jefferson Gomes</h2>
      <p>Desenvolvedor em Formação | ADS</p>
    </div>

    <div class="tags">
      <span class="tag">HTML5</span>
      <span class="tag">CSS3</span>
      <span class="tag">PHP</span>
      <span class="tag">XML</span>
      <span class="tag">Bootstrap</span>
    </div>

    <a href="https://github.com/jeffersoongomes" target="_blank" class="btn-github">Ver GitHub</a>
  </div>

</body>
</html>
